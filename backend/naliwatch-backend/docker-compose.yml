services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: naliwatch
      POSTGRES_PASSWORD: naliwatch
      POSTGRES_DB: naliwatch
    ports: ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://naliwatch:naliwatch@db:5432/naliwatch
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [db, redis]
    volumes: ["media:/srv/media"]
  worker:
    build: .
    command: celery -A app.workers.celery_app.celery worker -l info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://naliwatch:naliwatch@db:5432/naliwatch
      REDIS_URL: redis://redis:6379/0
    depends_on: [db, redis]
    volumes: ["media:/srv/media"]
  beat:
    build: .
    command: celery -A app.workers.celery_app.celery beat -l info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://naliwatch:naliwatch@db:5432/naliwatch
      REDIS_URL: redis://redis:6379/0
    depends_on: [db, redis]
volumes:
  pgdata:
  media:
